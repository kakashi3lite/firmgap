# firmgap scenario: 100 MW ERCOT campus with an ineligible revenue stack
# Enrolled in the PURA 39.170(b) large-load reliability service AND curtailing on wholesale prices.
# Expect: StatutoryBlocker + Path A (LMP only) vs Path B (reliability service only) remediation.

preset = "case"

# metadata (not part of the dossier hash): default rulepack and the verdict CI expects
jurisdiction = "ercot-sb6"
expected_verdict = "StatutoryBlocker"

# simulation parameters (override the case study)
target_mw = 100
interim_mw = 60
ceiling_mw = 60
queue_months = 40
interim_month = 6
bess_lead = 8
horizon = 72
bess_mw = 30
bess_h = 2
max_throttle_h = 12
defer_share = 0.4
gen_mw = 10
gen_cap_h = 50
safety_margin = 0.5
soc_window = 0.9
bess_derate = 0.95
defer_cost = 25

# compliance site profile
reliability_service_mw = 40
reliability_service_usd_per_mw_year = 40000
participates_in_reliability_service = true
price_responsive_lmp_curtailment = true
firm_shed_telemetry = true
ride_through_certified = true
backup_gen_mw = 60
backup_disclosed = true
sla_slack_hours = 1
