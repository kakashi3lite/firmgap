# SPDX-License-Identifier: AGPL-3.0-only
# Release pipeline: on a version tag, build static binaries for five targets, publish them with a
# SHA256SUMS file as a GitHub release, and deploy web/index.html to GitHub Pages.
# Linux (musl) and Windows (+crt-static) binaries are fully static; macOS binaries link only the
# system libSystem, which Apple does not allow to be linked statically.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-latest, musl: false, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest, musl: false, smoke: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, musl: false, smoke: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and target
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add "$TARGET"
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/firmgap"
          "$bin" --version
          "$bin" audit --scenario scenarios/ercot-sb6-100mw-compliant.toml --out dossier.json | grep -q 'VERDICT: BankablePass'
          "$bin" audit --verify dossier.json
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="firmgap-${tag}-${TARGET}"
          mkdir -p "dist/$name"
          cp LICENSE COMMERCIAL-LICENSE.md README.md "dist/$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/firmgap.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp "target/$TARGET/release/firmgap" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  web:
    name: web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Web reference model still matches the golden files
        run: node scripts/golden.mjs --check
      - name: Package standalone workbench
        run: |
          set -euo pipefail
          mkdir -p dist site
          cp web/index.html "dist/firmgap-web-${GITHUB_REF_NAME}.html"
          cp web/index.html site/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-web
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    name: publish release
    needs: [build, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "firmgap $TAG" \
            --notes "Static binaries for Linux (x86_64, aarch64), macOS (aarch64, x86_64) and Windows, plus the standalone web workbench. Verify downloads with SHA256SUMS. See CHANGELOG.md." \
            dist/*

  pages:
    name: deploy web workbench
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
