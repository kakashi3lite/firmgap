[package]
name = "firmgap-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
firmgap = { path = ".." }

[[bin]]
name = "scenario"
path = "fuzz_targets/scenario.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dossier"
path = "fuzz_targets/dossier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "share"
path = "fuzz_targets/share.rs"
test = false
doc = false
bench = false

# Keep the fuzz crate out of the parent workspace.
[workspace]
